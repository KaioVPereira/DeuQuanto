name: Deploy do servidor de sincronização

# Só o servidor vai para a VPS; mudança só no app não dispara (o app chega por APK novo).
on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'shared/**'
      - 'deploy/**'
      - '.github/workflows/deploy-sync.yml'
  workflow_dispatch:

concurrency:
  group: deuquanto-sync-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Testes das regras de sincronização
        working-directory: server
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy por SSH (git pull + docker compose build)
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -e
            cd /root/deuquanto
            git fetch --all
            git reset --hard origin/main
            cd deploy
            docker compose up -d --build
            docker image prune -f
